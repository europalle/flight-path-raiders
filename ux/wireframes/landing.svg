<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210" role="img" aria-label="Landing popup">
<title>Landing popup</title>
<rect width="420" height="210" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="419" height="209" rx="8" fill="#ffffff" stroke="#27303a" stroke-width="1.5"/>
<text x="20" y="36" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#27303a" text-anchor="start">You landed in Booty Bay</text>
<text x="20" y="58" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#66707c" text-anchor="start">You&#x27;re mid-prep on Ragnaroast (Heroic). Nothing is lost either way.</text>
<rect x="20" y="78" width="180" height="40" rx="4" fill="#27303a" stroke="#27303a" stroke-width="1.5"/>
<text x="110.0" y="102.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Finish now</text>
<rect x="212" y="78" width="188" height="40" rx="4" fill="#ffffff" stroke="#27303a" stroke-width="1"/>
<text x="306.0" y="102.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#27303a" text-anchor="middle">Pause until next flight</text>
<text x="20" y="142" font-family="Inter, Arial, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#27303a" text-anchor="start">Pausing automatically in 10 s</text>
<rect x="20" y="152" width="380" height="8" rx="2" fill="#ffffff" stroke="#8a94a0" stroke-width="1"/>
<rect x="20" y="152" width="228.0" height="8" rx="2" fill="#27303a" stroke="none" stroke-width="1"/>
<text x="20" y="186" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#66707c" text-anchor="start">Finished pulls are always saved. Ground play has no Frequent Flyer bonus.</text>
<circle cx="404" cy="92" r="9" fill="#2f6fd6"/>
<text x="404" y="96" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="404" cy="146" r="9" fill="#2f6fd6"/>
<text x="404" y="150" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
</svg>
