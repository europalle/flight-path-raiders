name: Engine checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install lupa==2.4 numpy pillow
      - run: npm install --prefix /tmp/fen fengari@0.1.5
      - name: Lua 5.1, LuaJIT and Fengari agree, and results match the saved golden file
        run: FENGARI=/tmp/fen/node_modules/fengari bash tests/check.sh
      - name: QA suite
        run: python3 tools/qa.py
      - name: Playtest rules
        run: FENGARI=/tmp/fen/node_modules/fengari node tools/playtest_qa.js
      - name: Addon loads and runs its self-test in Lua 5.1 with a WoW API stand-in
        run: python3 tools/build_addon.py && python3 tests/addon_test.py
      - name: Addon screens drawn headless pass the contrast check (both themes)
        run: python3 tools/addon_shot.py /tmp/shots
      - name: Learning path gate (learner bot within 2 weeks of the smart bot in 70% of guilds)
        run: FENGARI=/tmp/fen/node_modules/fengari python3 tools/gate_learning.py
